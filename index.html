<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Block known third-party ad/tracker telemetry network domains while keeping API/CSS functionality -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://www.youtube.com https://s.ytimg.com https://accounts.google.com;
        connect-src 'self' https://www.googleapis.com https://www.youtube-nocookie.com https://www.youtube.com https://ipapi.co https://accounts.google.com;
        child-src https://www.youtube-nocookie.com https://www.youtube.com;
        frame-src https://www.youtube-nocookie.com https://www.youtube.com https://accounts.google.com;
        img-src 'self' data: https: blob:;
        media-src 'self' data: blob: https:;
    ">
    <title>StreamQ</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%23ef4444' d='M464 256A208 208 0 1 0 48 256a208 208 0 1 0 416 0zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zM188.3 147.1c7.6-4.2 16.8-4.1 24.3 .5l144 88c7.1 4.4 11.5 12.1 11.5 20.4s-4.4 16-11.5 20.4l-144 88c-7.4 4.5-16.7 4.7-24.3 .5s-12.3-12.2-12.3-20.9l0-176c0-8.7 4.7-16.7 12.3-20.9z'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#0f0f11] text-white font-sans antialiased flex h-screen overflow-hidden selection:bg-red-500 selection:text-white">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-[#18181b] border-r border-gray-800 hidden absolute md:relative z-50 h-full md:flex flex-col flex-shrink-0">
    <div class="h-16 flex items-center justify-between px-6 border-b border-gray-800">
        <div class="flex items-center">
            <i class="fa-solid fa-play text-red-500 text-2xl mr-3"></i>
            <span class="text-xl font-bold tracking-wider">StreamQ</span>
        </div>
        <!-- Close button (Mobile Only) -->
        <button onclick="document.getElementById('sidebar').classList.add('hidden')" class="md:hidden text-gray-400 hover:text-white">
            <i class="fa-solid fa-xmark text-xl"></i>
        </button>
    </div>
    <nav class="flex-1 overflow-y-auto py-4">
        <ul class="space-y-2 px-3" id="sidebarMenu">
            <li><a href="#" onclick="UI.loadHome()" id="nav-home" class="nav-link flex items-center px-4 py-3 bg-gray-800 rounded-lg text-red-500 transition-colors"><i class="fa-solid fa-house w-6"></i> Home</a></li>
            <li><a href="#" onclick="UI.loadTrending()" id="nav-trending" class="nav-link flex items-center px-4 py-3 hover:bg-gray-800 rounded-lg text-gray-400 hover:text-white transition-colors"><i class="fa-solid fa-fire w-6"></i> Trending</a></li>
            <li><a href="#" onclick="UI.loadMusic()" id="nav-music" class="nav-link flex items-center px-4 py-3 hover:bg-gray-800 rounded-lg text-gray-400 hover:text-white transition-colors"><i class="fa-solid fa-music w-6"></i> Music</a></li>
            <li><a href="#" onclick="UI.loadExplore()" id="nav-explore" class="nav-link flex items-center px-4 py-3 hover:bg-gray-800 rounded-lg text-gray-400 hover:text-white transition-colors"><i class="fa-solid fa-compass w-6"></i> Explore</a></li>
            <!-- LIVE SECTION -->
            <li>
                <a href="#" onclick="UI.loadNewslive()" id="nav-newslive" class="nav-link flex items-center justify-between px-4 py-3 hover:bg-gray-800 rounded-lg text-gray-400 hover:text-white transition-colors">
                    <div class="flex items-center"><i class="fa-solid fa-newspaper w-6"></i> Latest news</div>
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                </a>
            </li>
            <!-- NOW PLAYING SECTION (Hidden by default) -->
            <li id="nav-now-playing-container" class="hidden">
                <a href="#" onclick="UI.showNowPlaying()" id="nav-now-playing" class="nav-link flex items-center px-4 py-3 hover:bg-gray-800 rounded-lg text-gray-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-circle-play w-6 text-red-500 animate-pulse"></i> Now Playing
                </a>
            </li>
                
            <li class="pt-4 pb-2 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Library</li>
            <li><a href="#" onclick="UI.loadHistory()" id="nav-history" class="nav-link flex items-center px-4 py-3 hover:bg-gray-800 rounded-lg text-gray-400 hover:text-white transition-colors"><i class="fa-solid fa-clock-rotate-left w-6"></i> History</a></li>
            <li><a href="#" onclick="UI.loadSaved()" id="nav-saved" class="nav-link flex items-center px-4 py-3 hover:bg-gray-800 rounded-lg text-gray-400 hover:text-white transition-colors"><i class="fa-solid fa-bookmark w-6"></i> Saved</a></li>
        </ul>
    </nav>
</aside>

    <audio id="bgAudio" loop playsinline src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="></audio>
    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full relative">
        <!-- Top Navbar -->
        <header class="h-16 flex items-center justify-between px-6 bg-[#0f0f11]/90 backdrop-blur-md sticky top-0 z-10 border-b border-gray-800 gap-4">
            <div class="flex items-center md:hidden">
                <button onclick="document.getElementById('sidebar').classList.remove('hidden')" class="mr-4 text-gray-400 hover:text-white transition">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <i class="fa-solid fa-play text-red-500 text-2xl mr-2"></i>
            </div>
            
            <div class="flex-1 max-w-2xl mx-auto flex items-center bg-[#18181b] border border-gray-700 rounded-full px-4 py-2 focus-within:border-gray-500 transition-colors">
                <i class="fa-solid fa-search text-gray-400 mr-3"></i>
                <input type="text" id="searchInput" placeholder="Search videos or live streams..." class="bg-transparent border-none outline-none text-sm w-full text-white placeholder-gray-500">
            </div>

            <!-- Header Sign In / Sign Out Button -->
            <button id="authBtn" onclick="AuthManager.isLoggedIn() ? AuthManager.logout() : AuthManager.login()" class="flex items-center gap-2 bg-gray-800 hover:bg-gray-700 text-xs font-semibold px-3 py-2 rounded-lg border border-gray-700 transition cursor-pointer">
                <i class="fa-brands fa-google text-white"></i>
                <span id="authBtnText" class="hidden sm:inline">Sign In</span>
                <span id="keyStatusBadge" class="w-2 h-2 rounded-full bg-red-500"></span>
            </button>
        </header>

        <!-- Dynamic Content Area -->
        <div id="contentArea" class="flex-1 overflow-y-auto p-6 scroll-smooth custom-scrollbar">
            
            <h2 id="pageTitle" class="text-2xl font-bold mb-6 tracking-wide flex items-center gap-3">Recommended</h2>

            <!-- Loading Indicator -->
            <div id="loader" class="hidden flex justify-center items-center h-32 mt-12">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-red-500"></div>
            </div>

            <!-- Video Grid -->
            <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Video cards injected here -->
            </div>
        
        <!-- AUTH MODAL -->
        <div id="apiKeyModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
            <div class="bg-[#18181b] border border-gray-800 rounded-2xl w-full max-w-md p-6 shadow-2xl relative text-center">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center gap-2">
                        <i class="fa-brands fa-google text-red-500 text-xl"></i>
                        <h2 class="text-lg font-bold">Google Authentication</h2>
                    </div>
                    <button onclick="UI.closeModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <p class="text-sm text-gray-300 mb-6">You need to sign in with your Google account to view feeds and search videos.</p>
                <div id="modalMessage" class="hidden text-xs py-2 px-3 rounded-lg mb-4"></div>
                <button onclick="UI.closeModal(); AuthManager.login();" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-2.5 rounded-lg transition">Sign In with Google</button>
            </div>
        </div>

            <!-- Video Player View -->
<div id="playerView" class="hidden flex flex-col lg:flex-row gap-8 max-w-7xl mx-auto w-full">
    <div class="flex-1 flex flex-col">
        
        <!-- Minimise to Background Button -->
        <button onclick="UI.minimisePlayer()" class="self-start mb-4 text-gray-400 hover:text-white flex items-center transition">
            <i class="fa-solid fa-compress mr-2"></i> Minimise to background
        </button>
        
        <!-- Video Player -->
        <div class="w-full aspect-video bg-black rounded-xl overflow-hidden shadow-2xl border border-gray-800">
            <div id="videoPlayer" class="w-full h-full"></div>
        </div>
        
        <!-- Video Title -->
        <h1 id="videoTitle" class="text-2xl font-bold mt-4 line-clamp-2"></h1>
        
        <!-- Stats Area -->
        <div class="flex items-center gap-3 text-sm text-gray-400 mt-2 font-medium">
            <span id="videoViews" class="text-gray-300"></span>
            <span>•</span>
            <span id="videoDate"></span>
            <span>•</span>
            <span class="flex items-center gap-1.5 text-gray-300" title="Likes">
                <i class="fa-regular fa-thumbs-up"></i>
                <span id="videoLikes">0</span>
            </span>
        </div>

        <!-- Channel Info & Actions -->
        <div class="flex items-center justify-between mt-4 pb-4 border-b border-gray-800 gap-4 flex-wrap">
            <div class="flex items-center">
                <div class="w-10 h-10 rounded-full bg-gray-700 mr-3 flex justify-center items-center">
                    <i class="fa-solid fa-user text-gray-400"></i>
                </div>
                <div>
                    <p id="videoChannel" class="font-semibold text-gray-200"></p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-3">
                <!-- New Stop Button -->
                <button onclick="UI.closePlayer()" class="bg-red-900/50 border border-red-700 text-red-300 px-5 py-2 rounded-full text-sm font-bold hover:bg-red-800/50 transition flex items-center gap-2">
                    <i class="fa-solid fa-stop"></i> <span>Stop</span>
                </button>
                
                <!-- Existing Save Button -->
                <button id="saveBtn" onclick="UI.toggleSaveCurrentVideo()" class="bg-[#27272a] border border-gray-700 text-white px-5 py-2 rounded-full text-sm font-bold hover:bg-gray-700 transition flex items-center gap-2">
                    <i class="fa-regular fa-bookmark"></i> <span>Save</span>
                </button>
            </div>
        </div>
    </div>
</div>
        </div>
    </main>

    <script src="app.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
